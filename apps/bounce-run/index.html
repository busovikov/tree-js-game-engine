<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bounce Run — an engine-only Haku vertical slice" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Bounce Run</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #app {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #102038;
      }
      #app {
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }
      #hud button {
        pointer-events: auto;
        min-width: 160px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <canvas id="canvas" aria-label="Bounce Run 3D game"></canvas>
      <div id="hud"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
