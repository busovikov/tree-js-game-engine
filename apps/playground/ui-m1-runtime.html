<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@haku UI M1 runtime acceptance</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: #0b1020; color: #e5e7eb; }
      header { padding: 20px clamp(16px, 4vw, 48px); border-bottom: 1px solid #24304b; background: #111831; }
      h1 { margin: 0 0 6px; font-size: clamp(20px, 3vw, 30px); }
      header p { margin: 0; color: #9ca9c3; }
      main { display: grid; grid-template-columns: minmax(0, 720px) minmax(280px, 1fr); gap: 20px; align-items: start; padding: 20px clamp(16px, 4vw, 48px) 48px; }
      .panel { min-width: 0; padding: 16px; border: 1px solid #293653; border-radius: 14px; background: #121a2e; box-shadow: 0 12px 32px #03071266; }
      .panel h2 { margin: 0 0 12px; font-size: 15px; color: #a9b7d2; text-transform: uppercase; letter-spacing: .08em; }
      #runtime-host { overflow: auto; padding: 14px; border-radius: 10px; background: #0e1527; }
      #runtime-host > [data-haku-ui-id] { max-width: 100%; }
      #runtime-host label { display: inline-flex !important; align-items: center; gap: 8px; cursor: pointer; }
      #runtime-host input, #runtime-host textarea, #runtime-host select, #runtime-host button { font: inherit; color: #e5e7eb; background: #17223a; border: 1px solid #3a4a6c; border-radius: 7px; padding: 7px 9px; }
      #runtime-host input[type='checkbox'], #runtime-host input[type='radio'], #runtime-host input[type='range'] { accent-color: #7c9cff; }
      #runtime-host input[type='range'] { width: 240px; }
      #runtime-host button { cursor: pointer; background: #3155a6; border-color: #5e83df; }
      #runtime-host textarea { width: 280px; }
      #runtime-host progress { accent-color: #56d6a7; }
      #runtime-host ol, #runtime-host ul { margin: 0; }
      pre, #event-log { min-height: 150px; max-height: 330px; overflow: auto; margin: 0; padding: 12px; border-radius: 9px; background: #080d19; color: #b8c8e8; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
      #event-log { margin-top: 12px; padding-left: 32px; }
      #event-log li { margin: 0 0 5px; }
      .status { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 12px; color: #74e5bc; font-size: 13px; }
      .status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 12px currentColor; }
      @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <h1>@haku UI v2 · Milestone 1 acceptance</h1>
      <p>Standalone React-free fixture for native pointer, keyboard, value, event, and layout verification.</p>
    </header>
    <main>
      <section class="panel" aria-labelledby="runtime-title">
        <h2 id="runtime-title">Every required runtime kind</h2>
        <div id="runtime-host" data-testid="runtime-host"></div>
      </section>
      <aside class="panel" aria-labelledby="telemetry-title">
        <h2 id="telemetry-title">Live telemetry</h2>
        <div class="status" id="fixture-status">Mounted · zero React</div>
        <pre id="value-log" data-testid="value-log"></pre>
        <ol id="event-log" data-testid="event-log"></ol>
      </aside>
    </main>
    <script type="module" src="/src/ui-m1-runtime/runtime.ts"></script>
  </body>
</html>
